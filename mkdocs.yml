site_name: Jeremy's Recipe Collection
site_description: Jeremy's Recipe Collection
site_url: https://normanj9.github.io/recipes/
repo_url: https://github.com/normanj9/recipes
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - toc:
      permalink: true

plugins:
  - search
